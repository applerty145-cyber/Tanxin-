<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜架高床歷年作品集</title>
    <style>
       /* ====================
   1. 頂部深藍色 BAR 樣式
   ==================== */
.site-header-bar {
    width: 100%;
    /* 使用 min-height 讓高度自動適應內部按鈕大小 */
    min-height: 70px; 
    padding: 10px 25px; /* 上下左右留白 */
    background-color: #1e3d6b;
    background-image: 
        radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0),
        radial-gradient(rgba(0,0,0,0.1) 1px, transparent 0);
    background-size: 4px 4px;
    background-position: 0 0, 2px 2px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.1);
    
    /* 啟動 Flexbox 讓左右兩側內容完美對齊 */
    display: flex;
    justify-content: space-between;
    align-items: center; 
    box-sizing: border-box;
    
    /* 固定在畫面上方 */
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
}

/* 為了不被 fixed 的 header 擋住內容，主要內容區需要往下推 */
.main-content {
    margin-top: 80px; 
}

/* 左側 LOGO 樣式 */
.logo-link { display: flex; align-items: center; }
.header-logo {
    max-height: 45px; /* LOGO 大小可在此微調 */
    width: auto;
    object-fit: contain;
    position: static; /* 覆蓋原本的 absolute */
}

/* 右側按鈕群組 */
.header-actions {
    display: flex;
    align-items: center;
    gap: 15px; /* 按鈕之間的間距 */
}

/* ====================
   2. 聯絡我們 & 目錄按鈕 (參照圖一)
   ==================== */
.contact-btn {
    background: linear-gradient(135deg, #a78bfa, #8b5cf6); /* 類似圖一的紫色漸層 */
    color: white;
    text-decoration: none;
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: bold;
    letter-spacing: 1px;
    transition: transform 0.2s, opacity 0.2s;
}
.contact-btn:hover {
    opacity: 0.9;
    transform: scale(1.05);
}

/* 圓形框三條線目錄 */
.menu-btn {
    width: 42px;
    height: 42px;
    border: 1px solid white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: background 0.3s;
}
.menu-btn:hover {
    background: rgba(255, 255, 255, 0.15);
}
.hamburger-lines {
    display: flex;
    flex-direction: column;
    gap: 4px; /* 線條間距 */
}
.hamburger-lines span {
    display: block;
    width: 18px;
    height: 1.5px;
    background-color: white;
}

/* ====================
   3. 側邊滑出選單樣式
   ==================== */
.sidebar {
    position: fixed;
    top: 0;
    right: -320px; /* 初始隱藏在右側畫面外 */
    width: 300px;
    height: 100vh;
    background: #fafafa;
    box-shadow: -5px 0 25px rgba(0,0,0,0.15);
    z-index: 999999;
    transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    flex-direction: column;
}
.sidebar.active { right: 0; } /* 啟動時滑入 */

.sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 999998;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s;
}
.sidebar-overlay.active {
    opacity: 1;
    visibility: visible;
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 25px;
    background: #1e3d6b;
    color: white;
}
.sidebar-header h3 { margin: 0; font-weight: normal; letter-spacing: 1px; }
.close-sidebar { font-size: 1.5rem; cursor: pointer; padding: 5px; }

.sidebar-menu { list-style: none; padding: 20px; margin: 0; }
.sidebar-menu li { margin-bottom: 15px; }
.sidebar-menu a {
    text-decoration: none;
    color: #4a3c31;
    font-size: 1.1rem;
    display: block;
    padding: 12px 15px;
    background: white;
    border-radius: 8px;
    border: 1px solid #eee;
    transition: all 0.2s;
    font-weight: bold;
}
.sidebar-menu a:hover {
    background: #fff9c4;
    border-color: #fdd835;
    transform: translateX(5px);
}
    </style>
</head>
<body>

    <!-- 🛠️【修改調整 4】調整 HTML 結構先後順序：將字卡移至上方，圈圈移至下方 -->

        </div>

    <!-- 隱藏的側邊欄 (點擊目錄後滑出) -->

    <div class="sidebar" id="sidebar">

    </div>

        <img src="0-開頭字卡.png" alt="開頭字卡" class="hero-banner">

        <h1 class="main-title"></h1>

        <div class="gallery-container">
            <a href="B1.html" class="card">
                <img src="6.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">A款 客製雙層床</h2>

            <a href="B7.html" class="card">
                <img src="7.webp" alt="客製架高床預覽圖">

            <a href="B11.html" class="card">

            <a href="B16.html" class="card">
                <img src="16.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">D款 客製收納衣櫃架高床</h2>

              <a href="B20.html" class="card">
                <img src="22.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">E款 客製加高大四斗雙層床</h2>
            </a>

             <a href="B24.html" class="card">
                <img src="24.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">F款 客製交錯式雙層床</h2>
            </a>
        </div>
    </div>

    <div class="site-footer-bar"></div>

    <script>
        // 控制目錄側邊欄滑出與隱藏的語法
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    
    // 切換 active 狀態來控制 CSS 動畫
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
}
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader) { preloader.remove(); }
            }, 500);
        });
    </script>
    <!-- 官方 LINE 懸浮按鈕 -->
    <a href="https://line.me/R/ti/p/https://line.me/R/ti/p/@ypp1461n" target="_blank" class="line-float-btn" title="加入官方 LINE 諮詢">

</body>
