<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜詳細作品展示</title>
    <style>
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.ttf') format('truetype');
            font-display: swap;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'CheckpointFont', sans-serif; 
            color: #4a3c31; 
            background-color: #fafafa;
            background-image: 
                linear-gradient(rgba(176, 196, 222, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 196, 222, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-content {
            flex: 1 0 auto;
        }

        /* 頁首與頁尾的深藍色紙質感樣式 */
        .site-header-bar, .site-footer-bar {
            width: 100%;
            height: 35px;
            background-color: #1e3d6b;
            background-image: 
                radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0),
                radial-gradient(rgba(0,0,0,0.1) 1px, transparent 0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .site-footer-bar {
            margin-top: 60px;
        }

        /* 🛠️【優化】頂部導覽列排版 (Logo、按鈕與選單) */
        .top-nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            position: relative;
            z-index: 5;
        }

        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo { 
            max-width: 120px; 
            height: auto;
        }
        
        .back-btn { 
            background: #fff9c4; 
            color: #4a3c31; 
            border: 1px solid #e0e0e0; 
            padding: 8px 18px; 
            border-radius: 0px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-family: 'CheckpointFont', sans-serif; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05); 
            transform: rotate(-2deg); 
            transition: transform 0.2s;
            font-weight: normal; 
        }
        .back-btn:hover { transform: rotate(0deg) scale(1.05); }

        /* 🛠️【新增】漢堡選單按鈕 */
        .menu-toggle-btn {
            font-size: 1.8rem;
            color: #1e3d6b;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .menu-toggle-btn:hover { transform: scale(1.1); }

        .section-title { 
            color: #4a3c31; 
            font-size: 2rem; 
            text-align: center; 
            margin: 40px 0 40px 0; /* 因應頂部改版微調間距 */
            white-space: nowrap; 
            letter-spacing: 2px; 
            font-weight: normal; 
        }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; padding: 0 20px; box-sizing: border-box; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; padding: 10px; box-sizing: border-box;}
        .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; pointer-events: none; border-radius: 2px;}
        .video-container { max-width: 800px; margin: 50px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 10px; background: #fff;}
        
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 99999; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        #lightbox-img { max-width: 100vw; max-height: 85vh; object-fit: contain; margin: auto; cursor: grab; transform-origin: center; transition: transform 0.1s ease-out; }
        #lightbox-img:active { cursor: grabbing; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.3); font-size: 3.5rem; cursor: pointer; user-select: none; padding: 15px; transition: color 0.3s; z-index: 10; font-family: sans-serif; }
        .nav-btn:hover { color: rgba(255, 255, 255, 0.9); }
        #prev { left: 10px; } 
        #next { right: 10px; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 2.5rem; cursor: pointer; z-index: 100000; width: 50px; height: 50px; text-align: center; line-height: 50px; font-family: sans-serif;}
        .dots-container { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); cursor: pointer; transition: background 0.3s; }
        
        @media (max-width: 767px) { 
            .nav-btn { display: none !important; } 
            .section-title { font-size: 1.4rem; margin: 30px 0 20px 0; } 
            .top-nav-container { padding: 15px 15px; }
        }       

        /* 載入等待動畫（Preloader） */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fafafa; 
            z-index: 999999; 
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease; 
        }
        .loader-container { display: flex; flex-direction: column; align-items: center; gap: 25px; max-width: 85%; }
        .loader-spinner {
            width: 42px; height: 42px;  
            border: 4px solid rgba(30, 61, 107, 0.1);
            border-top: 4px solid #1e3d6b; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loader-logo { max-width: 240px; height: auto; object-fit: contain; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body.loaded #preloader { opacity: 0; pointer-events: none; }

        /* 🛠️【新增】目錄側邊欄與遮罩 */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        
        .sidebar {
            position: fixed; top: 0; right: -300px;
            width: 280px; height: 100%;
            background: #fafafa;
            z-index: 10001;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            overflow-y: auto;
            border-left: 5px solid #1e3d6b;
        }
        .sidebar.active { right: 0; }
        
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: #1e3d6b; color: white;
        }
        .sidebar-header h3 { margin: 0; font-weight: normal; letter-spacing: 2px; font-size: 1.2rem;}
        .close-sidebar-btn { font-size: 1.5rem; cursor: pointer; font-family: sans-serif; }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { border-bottom: 1px solid #eee; }
        .sidebar-menu a, .accordion-btn {
            display: block; padding: 18px 20px;
            color: #4a3c31; text-decoration: none;
            font-size: 1.1rem; cursor: pointer;
            transition: background 0.2s;
        }
        .sidebar-menu a:hover, .accordion-btn:hover { background: #fff9c4; }
        
        /* 🛠️【新增】折疊選單樣式 */
        .accordion-btn { display: flex; justify-content: space-between; align-items: center; }
        .accordion-icon { transition: transform 0.3s ease; font-size: 0.8rem; }
        .accordion-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #fff;
            list-style: none; padding: 0; margin: 0;
        }
        .accordion-content li a { padding: 12px 20px 12px 40px; font-size: 1rem; color: #666; }
        .accordion-btn.active .accordion-icon { transform: rotate(180deg); }

        /* 🛠️【新增】LINE 懸浮按鈕 */
        .line-float-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 55px; height: 55px;
            background-color: #06C755;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 9999;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }
        .line-float-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .line-float-btn svg { width: 35px; height: 35px; fill: white; }
    </style>
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-container">
            <img src="0-片尾字卡.png" alt="添興家具" class="loader-logo">
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- 🛠️【優化】整合後的頂部導覽列 -->
    <div class="site-header-bar"></div>
    <div class="top-nav-container">
        <button class="back-btn" onclick="window.location.href='index.html'">返回首頁</button>
        <div class="nav-right-group">
            <img src="0-logo-02.png" alt="添興家具" class="header-logo">
            <div class="menu-toggle-btn" onclick="toggleSidebar()">☰</div>
        </div>
    </div>

    <div class="main-content">
        <h2 class="section-title">A款 客製雙層床</h2>

        <div class="gallery">
            <div class="card" onclick="openItem(event, 0)"><img src="1.webp" alt="1"></div>
            <div class="card" onclick="openItem(event, 1)"><img src="2.webp" alt="2"></div>
            <div class="card" onclick="openItem(event, 2)"><img src="3.webp" alt="3"></div>
            <div class="card" onclick="openItem(event, 3)"><img src="4.webp" alt="4"></div>
            <div class="card" onclick="openItem(event, 4)"><img src="5.webp" alt="5"></div>
            <div class="card" onclick="openItem(event, 5)"><img src="6.webp" alt="6"></div>
        </div>

        <div class="video-container" id="my-video-box">
            <video width="100%" controls>
                <source src="1.mov" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- 🛠️【新增】目錄側邊欄結構 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>網站目錄</h3>
            <div class="close-sidebar-btn" onclick="toggleSidebar()">✕</div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html">返回首頁</a></li>
            <li>
                <div class="accordion-btn" onclick="toggleAccordion(this)">
                    客製架高床作品 <span class="accordion-icon">▼</span>
                </div>
                <ul class="accordion-content">
                    <li><a href="#">A款 客製雙層床 (目前頁面)</a></li>
                    <li><a href="#">B款 實木高架床</a></li>
                    <li><a href="#">C款 收納型層床</a></li>
                </ul>
            </li>
            <li>
                <div class="accordion-btn" onclick="toggleAccordion(this)">
                    常見問題 Q&A <span class="accordion-icon">▼</span>
                </div>
                <ul class="accordion-content">
                    <li><a href="#">訂製流程說明</a></li>
                    <li><a href="#">尺寸與材質挑選</a></li>
                    <li><a href="#">運送與安裝須知</a></li>
                </ul>
            </li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </div>

    <!-- 🛠️【新增】LINE 懸浮按鈕 (替換 href 內的連結為你的官方 LINE) -->
    <a href="https://line.me/ti/p/~你的LINE_ID" class="line-float-btn" target="_blank" title="聯絡我們">
        <svg viewBox="0 0 24 24">
            <path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.122.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967 1.739-1.907 2.572-3.843 2.572-5.992zm-18.988 2.595h-2.392c-.266 0-.482-.216-.482-.482v-4.975c0-.266.216-.482.482-.482h2.392c.266 0 .482.216.482.482v4.975c0 .266-.216.482-.482.482zm6.275 0h-2.392c-.266 0-.482-.216-.482-.482v-4.975c0-.266.216-.482.482-.482h2.392c.266 0 .482.216.482.482v4.975c0 .266-.216.482-.482.482zm6.275 0h-2.392c-.266 0-.482-.216-.482-.482v-4.975c0-.266.216-.482.482-.482h2.392c.266 0 .482.216.482.482v4.975c0 .266-.216.482-.482.482zm6.275-2.091h-2.392v-2.884c0-.266-.216-.482-.482-.482h-.995c-.266 0-.482.216-.482.482v4.975c0 .266.216.482.482.482h3.869c.266 0 .482-.216.482-.482v-.995c0-.266-.216-.482-.482-.482z"/>
        </svg>
    </a>

    <!-- Lightbox -->
    <div id="lightbox">
        <div class="close-btn" onclick="closeItem(event)">✕</div>
        <span class="nav-btn" id="prev" onclick="changeImage(event, -1)">&#10094;</span>
        <img id="lightbox-img" src="" alt="放大圖" draggable="false">
        <span class="nav-btn" id="next" onclick="changeImage(event, 1)">&#10095;</span>
        <div class="dots-container" id="dots-container"></div>
    </div>

    <script>
        // 載入等待動畫
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader) { preloader.remove(); }
            }, 500);
        });

        // 🛠️【新增】目錄側邊欄控制
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // 🛠️【新增】折疊選單控制 (Accordion)
        function toggleAccordion(element) {
            element.classList.toggle('active');
            var content = element.nextElementSibling;
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
        }

        // 原始 Lightbox 程式碼保留
        var images = ["1.webp", "2.webp", "3.webp", "4.webp", "5.webp", "6.webp"];
        var currentIndex = 0;
        var scale = 1; var translateX = 0, translateY = 0; var lastTranslateX = 0; var lastTranslateY = 0;
        var isDragging = false; var startX, startY;
        var startDist = 0; var touchStartX = 0, touchStartY = 0; var lastTapTime = 0; 
        var isLightboxOpen = false;

        var dotsContainer = document.getElementById('dots-container');
        images.forEach((_, i) => {
            let dot = document.createElement('div');
            dot.className = 'dot';
            dot.onclick = (e) => { e.stopPropagation(); openItem(e, i); };
            dotsContainer.appendChild(dot);
        });

        function updateDots() {
            let dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.style.background = (i === currentIndex) ? 'white' : 'rgba(255,255,255,0.4)';
            });
        }

        function applyTransform() { document.getElementById('lightbox-img').style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
        function resetZoom() { scale = 1; translateX = 0; translateY = 0; lastTranslateX = 0; lastTranslateY = 0; applyTransform(); }

        function openItem(e, index) {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            currentIndex = index; resetZoom();
            document.getElementById('lightbox-img').src = images[currentIndex];
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('my-video-box').style.visibility = 'hidden';
            updateDots();
            if (!isLightboxOpen) { history.pushState({ lightbox: true }, ""); isLightboxOpen = true; }
        }
        
        function closeItem(e, fromPopState = false) {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('my-video-box').style.visibility = 'visible';
            if (isLightboxOpen && !fromPopState) { isLightboxOpen = false; history.back(); } else { isLightboxOpen = false; }
        }

        window.addEventListener('popstate', (e) => { if (isLightboxOpen) { closeItem(null, true); } });

        function changeImage(e, step) {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            currentIndex = (currentIndex + step + images.length) % images.length;
            document.getElementById('lightbox-img').src = images[currentIndex];
            resetZoom(); updateDots();
        }

        const lightboxBox = document.getElementById('lightbox');
        lightboxBox.addEventListener('wheel', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                e.preventDefault();
                scale += e.deltaY * -0.002;
                scale = Math.min(Math.max(1, scale), 4);
                if (scale === 1) { translateX = 0; translateY = 0; lastTranslateX = 0; lastTranslateY = 0; }
                applyTransform();
            }
        }, {passive: false});

        lightboxBox.addEventListener('mousedown', (e) => {
            if (scale > 1) { isDragging = true; startX = e.clientX; startY = e.clientY; }
        });
        lightboxBox.addEventListener('mousemove', (e) => {
            if (isDragging && scale > 1) {
                translateX = lastTranslateX + (e.clientX - startX);
                translateY = lastTranslateY + (e.clientY - startY);
                applyTransform();
            }
        });
        lightboxBox.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; lastTranslateX = translateX; lastTranslateY = translateY; } });
        lightboxBox.addEventListener('mouseleave', () => { isDragging = false; });

        lightboxBox.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
                if (scale > 1) { isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; }
            } else if (e.touches.length === 2) {
                startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, {passive: false});

        lightboxBox.addEventListener('touchmove', (e) => {
            if(document.getElementById('lightbox').style.display !== 'flex') return;
            e.preventDefault(); 
            if (e.touches.length === 1 && isDragging && scale > 1) {
                translateX = lastTranslateX + (e.touches[0].clientX - startX);
                translateY = lastTranslateY + (e.touches[0].clientY - startY);
                let maxTx = (window.innerWidth * scale - window.innerWidth) / 2;
                let maxTy = (window.innerHeight * scale - window.innerHeight) / 2;
                translateX = Math.max(-maxTx, Math.min(maxTx, translateX));
                translateY = Math.max(-maxTy, Math.min(maxTy, translateY));
                applyTransform();
            } else if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                let newScale = scale * (dist / startDist);
                scale = Math.min(Math.max(1, newScale), 4);
                startDist = dist; 
                if (scale === 1) { translateX = 0; translateY = 0; lastTranslateX = 0; lastTranslateY = 0; }
                applyTransform();
            }
        }, {passive: false});

        lightboxBox.addEventListener('touchend', (e) => {
            if (isDragging) { isDragging = false; lastTranslateX = translateX; lastTranslateY = translateY; }
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            let moveDist = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTapTime;
            
            if (tapLength < 300 && tapLength > 0 && moveDist < 10 && e.changedTouches.length === 1) {
                resetZoom(); e.preventDefault();
            } else if (e.changedTouches.length === 1 && scale === 1) {
                let diff = touchStartX - touchEndX;
                if (diff > 50) { changeImage(null, 1); } else if (diff < -50) { changeImage(null, -1); }
            }
            lastTapTime = currentTime;
        });
    </script>

    <div class="site-footer-bar"></div>

</body>
</html>
