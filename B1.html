<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜A款 客製雙層床</title>
    <style>
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.ttf?v=2') format('truetype');
            font-display: swap;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        /* 網頁基本設定 - 與首頁完全一致 */
        body { 
            font-family: 'CheckpointFont', sans-serif; 
            color: #3d2b1f; 
            background-color: #f2f5f9; 
            -webkit-tap-highlight-color: transparent; 
            
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        /* 1. 柔和的天空藍與灰白雲霧漸層色彩層 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2; 
            background-color: #f2f5f9; 
            background-image: 
                radial-gradient(circle at 65% 35%, rgba(135, 185, 255, 0.55) 0%, rgba(135, 185, 255, 0.1) 45%, transparent 65%),
                radial-gradient(circle at 30% 85%, rgba(175, 215, 255, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(190, 225, 255, 0.4) 0%, transparent 55%),
                radial-gradient(circle at 45% 55%, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
        }

        /* 2. 底片顆粒感（噪點）質感層 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; 
            pointer-events: none; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.25; 
            mix-blend-mode: overlay;
        }

        body.no-scroll {
            overflow: hidden;
        }

        .main-content {
            flex: 1 0 auto;
            padding-bottom: 40px;
        }

            min-height: 70px;

            -webkit-backdrop-filter: blur(16px);
