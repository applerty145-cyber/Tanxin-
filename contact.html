<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們｜添興家具</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #fafafa; 
            color: #4a3c31;
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .contact-container h1 {
            color: #1e3d6b;
            margin-top: 0;
        }
        .info-box {
            background: #f4f6f9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.8;
        }
        .map-container {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .back-btn {
            display: inline-block;
            background: #1e3d6b;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 30px;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>聯絡添興家具</h1>
        
        <!-- Google Maps 嵌入區 (請將 src 替換為你們店的真實 Google Maps 嵌入碼) -->
        <div class="map-container">
            <iframehttps://maps.app.goo.gl/QM7gWZusWBfrxmHs7></iframe>
        </div>

        <div class="info-box">
            <p>📍 <strong>地址：</strong>添興家具有限公司(中和旗艦店)</p>
            <p>📞 <strong>電話：</strong>(02)22492876</p>
            <p>⏰ <strong>營業時間：</strong>週一至週六 11:00 - 21:00，週日 11:00 - 20:00</p>
        </div>

        <a href="#" class="back-btn" onclick="window.close(); return false;">關閉頁面</a>
    </div>

</body>
</html>
