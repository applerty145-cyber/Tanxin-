<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們｜添興家具</title>
    <style>
        body { 
            font-family: checkpoint.ttf; 
            background-color: #fafafa; 
            color: #4a3c31;
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .contact-container h1 {
            color: #1e3d6b;
            margin-top: 0;
        }
        .info-box {
            background: #f4f6f9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.8;
        }
        .map-container {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .back-btn {
            display: inline-block;
            background: #1e3d6b;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 30px;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>聯絡添興家具</h1>
        
        <!-- Google Maps 嵌入區 (請將 src 替換為你們店的真實 Google Maps 嵌入碼) -->
        <div class="map-container">
          <!-- 把寬度改成 100%，高度可以依照你的排版需求微調，例如 300 或 350 -->
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7231.7542704753305!2d121.50076926219403!3d25.00429053891465!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a9da16d8f7e3%3A0x9a0f3f1e883aa046!2z5re76IiI5a625YW35pyJ6ZmQ5YWs5Y-4!5e0!3m2!1szh-TW!2stw!4v1785409793792!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>" width="100%" height="300" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <div class="info-box">
            <p>📍 <strong>地址：</strong>添興家具有限公司(中和旗艦店)</p>
            <p>📞 <strong>電話：</strong>(02)22492876</p>
            <p>⏰ <strong>營業時間：</strong>週一至週六 11:00 - 21:00，週日 11:00 - 20:00</p>
        </div>

        <a href="#" class="back-btn" onclick="window.close(); return false;">關閉頁面</a>
    </div>

</body>
</html>
