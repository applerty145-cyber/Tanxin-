<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們｜添興家具</title>
    <style>
        /* 1. 這裡告訴網頁去哪裡載入字體 (獨立區塊) */
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.ttf?v=2') format('truetype');
            font-display: swap;
        }

        /* 2. 這裡指定整個網頁使用剛剛載入的字體 */
        body { 
            font-family: 'CheckpointFont', sans-serif;
            background-color: #fafafa; 
            color: #4a3c31;
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .contact-container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .contact-container h1 {
            color: #1e3d6b;
            margin-top: 0;
            letter-spacing: 2px; /* 加一點字距讓標題更好看 */
        }
        .info-box {
            background: #f4f6f9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.8;
            font-size: 1.1rem; /* 字體稍微放大一點點 */
        }
        .map-container {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        /* 讓地圖自動填滿容器 */
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .back-btn {
            display: inline-block;
            background: #1e3d6b;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 30px;
            transition: opacity 0.2s;
            font-family: sans-serif; /* 按鈕維持清晰的系統字體 */
            font-weight: bold;
        }
        .back-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>聯絡添興家具</h1>
        
        <!-- Google Maps 嵌入區 (語法已清理乾淨) -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7231.7542704753305!2d121.50076926219403!3d25.00429053891465!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a9da16d8f7e3%3A0x9a0f3f1e883aa046!2z5re76IiI5a625YW35pyJ6ZmQ5YWs5Y-4!5e0!3m2!1szh-TW!2stw!4v1785409793792!5m2!1szh-TW!2stw" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <div class="info-box">
            <p>📍 <strong>地址：</strong>添興家具有限公司 (中和旗艦店)</p>
            <p>📞 <strong>電話：</strong>(02) 2249-2876</p>
            <p>⏰ <strong>營業時間：</strong>週一至週六 11:00 - 21:00，週日 11:00 - 20:00</p>
        </div>

        <a href="#" class="back-btn" onclick="window.close(); return false;">關閉頁面</a>
    </div>

</body>
</html>
